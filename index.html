<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1E1E1E;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .navbar {
      width: 100%;
      height: 64px;
      background-color: #EFEFEF;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      margin: 20px 20px 0 20px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      background-color: #D9D9D9;
      border-radius: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .nav-btn img {
      width: 20px;
      height: 20px;
      display: block;
    }

    .nav-logo {
      height: 100%;
      width: auto;
      display: block;
      object-fit: contain;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button class="nav-btn" type="button">
      <img src="/assets/icons/menu.svg" alt="">
    </button>
    <img src="/assets/logo.png" alt="" class="nav-logo">
    <button class="nav-btn" type="button">
      <img src="/assets/icons/user.svg" alt="">
    </button>
  </div>
</body>
</html>
