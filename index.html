<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1E1E1E;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      position: relative;
    }

    .navbar {
      width: 100%;
      height: 64px;
      background-color: #EFEFEF;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      margin: 20px 20px 0 20px;
      position: relative;
      z-index: 20;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      background-color: #D9D9D9;
      border-radius: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      padding: 0;
      position: relative;
      z-index: 30;
    }

    .nav-btn img {
      width: 20px;
      height: 20px;
      display: block;
    }

    .nav-logo {
      height: 100%;
      width: auto;
      display: block;
      object-fit: contain;
      padding: 2px;
    }

    .sidebar-left {
      position: fixed;
      top: 104px;
      left: 0;
      width: 260px;
      height: calc(100% - 124px);
      background-color: #EFEFEF;
      border-top-right-radius: 100px;
      border-bottom-right-radius: 100px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: 10;
      box-shadow: 4px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar-left.open {
      transform: translateX(0);
    }

    .sidebar-logo {
      width: 100%;
      padding: 16px 0 0 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .sidebar-logo img {
      width: 40%;
      height: auto;
      display: block;
      border-radius: 100%;
      object-fit: contain;
      background-color: transparent;
    }

    .sidebar-right {
      position: fixed;
      top: 104px;
      right: 0;
      width: 260px;
      height: calc(100% - 124px);
      background-color: #EFEFEF;
      border-top-left-radius: 100px;
      border-bottom-left-radius: 100px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
      z-index: 10;
      box-shadow: -4px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar-right.open {
      transform: translateX(0);
    }

    .user-pfp {
      width: 80px;
      height: 80px;
      background-color: #D9D9D9;
      border-radius: 100%;
      margin-top: 16px;
      flex-shrink: 0;
    }

    .user-name {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 18px;
      color: #1E1E1E;
      margin-top: 12px;
      text-align: center;
    }

    .user-handle {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: #666666;
      margin-top: 4px;
      text-align: center;
    }

    .user-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 24px;
      padding: 0 10px;
      flex: 1;
    }

    .user-btn {
      width: 100%;
      height: 44px;
      background-color: #D9D9D9;
      border: none;
      border-radius: 100px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #1E1E1E;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }

    .logout-btn {
      width: 100%;
      height: 44px;
      background-color: #D9D9D9;
      border: none;
      border-radius: 100px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #1E1E1E;
      cursor: pointer;
      margin-bottom: 16px;
      flex-shrink: 0;
      padding: 0;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 5;
      display: none;
      pointer-events: none;
    }

    .overlay.active {
      display: block;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button class="nav-btn" type="button" id="menuBtn">
      <img src="/assets/icons/menu.svg" alt="">
    </button>
    <img src="/assets/logo.png" alt="" class="nav-logo">
    <button class="nav-btn" type="button" id="userBtn">
      <img src="/assets/icons/user.svg" alt="">
    </button>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="sidebar-left" id="sidebarLeft">
    <div class="sidebar-logo">
      <img src="/assets/logo.png" alt="logo">
    </div>
  </div>

  <div class="sidebar-right" id="sidebarRight">
    <div class="user-pfp"></div>
    <div class="user-name">John Doe</div>
    <div class="user-handle">@johndoe</div>
    <div class="user-buttons">
      <button class="user-btn" type="button">Settings</button>
      <button class="user-btn" type="button">Profile</button>
      <button class="user-btn" type="button">Notifications</button>
      <button class="user-btn" type="button">Privacy</button>
    </div>
    <button class="logout-btn" type="button">Log Out</button>
  </div>

  <script>
    (function() {
      const menuBtn = document.getElementById('menuBtn');
      const userBtn = document.getElementById('userBtn');
      const sidebarLeft = document.getElementById('sidebarLeft');
      const sidebarRight = document.getElementById('sidebarRight');
      const overlay = document.getElementById('overlay');

      function closeAll() {
        sidebarLeft.classList.remove('open');
        sidebarRight.classList.remove('open');
        overlay.classList.remove('active');
      }

      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (sidebarLeft.classList.contains('open')) {
          closeAll();
        } else {
          closeAll();
          sidebarLeft.classList.add('open');
          overlay.classList.add('active');
        }
      });

      userBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (sidebarRight.classList.contains('open')) {
          closeAll();
        } else {
          closeAll();
          sidebarRight.classList.add('open');
          overlay.classList.add('active');
        }
      });

      overlay.addEventListener('click', closeAll);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeAll();
        }
      });
    })();
  </script>
</body>
</html>
