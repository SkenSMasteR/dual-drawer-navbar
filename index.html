<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: black;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .navbar {
      width: 100%;
      height: 64px;
      background-color: #EFEFEF;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      margin-top: 20px;
      max-width: 600px;
    }

    .nav-left,
    .nav-right {
      width: 40px;
      height: 40px;
      background-color: #D9D9D9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-left img,
    .nav-right img {
      width: 20px;
      height: 20px;
      display: block;
    }

    .nav-logo {
      height: 28px;
      width: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="nav-left">
      <img src="/assets/icons/menu.svg" alt="">
    </div>
    <img src="/assets/logo.png" alt="" class="nav-logo">
    <div class="nav-right">
      <img src="/assets/icons/user.svg" alt="">
    </div>
  </div>
</body>
</html>
